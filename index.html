<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Euler Games · Juega sin descargar</title>
<style>
:root{--bg:#f4f1ee;--sf:#fff;--tx:#1b1714;--mu:#6b625b;--bd:#e3ddd7;--ac:#e01a35;--ac2:#9b0f24;--sh:0 6px 20px rgba(0,0,0,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110e0e;--sf:#1b1616;--tx:#f1e9e4;--mu:#a2958d;--bd:#2c2323;--sh:0 6px 24px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#110e0e;--sf:#1b1616;--tx:#f1e9e4;--mu:#a2958d;--bd:#2c2323;--sh:0 6px 24px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font:700 22px Georgia,serif;letter-spacing:.02em;display:flex;align-items:center;gap:8px}.logo b{color:var(--ac)}
.search{flex:1;min-width:160px;max-width:520px;padding:10px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:10px 18px;background:var(--ac);color:#fff;font-weight:600}
button:hover{background:var(--ac2)}button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.ghost:hover{background:var(--sf)}
main{max-width:1100px;margin:0 auto;padding:16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}.cats button{background:var(--sf);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}.cats button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hero{animation:glow 8s linear infinite;border-radius:20px;padding:28px;color:#fff;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:var(--sh);margin-bottom:22px;min-height:190px}
.hero h2{font:700 32px Georgia,serif;margin:0 0 6px}.hero p{margin:0 0 14px;max-width:520px;opacity:.9}.hero .em{font-size:84px}
h3{margin:22px 0 10px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s;box-shadow:var(--sh)}.card:hover{transform:translateY(-3px);animation:glow 4s linear infinite}
.cv{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:64px}
.ci{padding:10px 12px}.ci b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ci span{color:var(--mu);font-size:13px}
.empty{color:var(--mu);padding:30px;text-align:center;border:1px dashed var(--bd);border-radius:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--sf);border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--sh);animation:glow 6s linear infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px #ff2d3d,0 0 26px 3px #ff2d3d,0 0 70px 10px #ff2d3d66}25%{box-shadow:0 0 0 2px #ff9a1f,0 0 26px 3px #ff9a1f,0 0 70px 10px #ff9a1f66}50%{box-shadow:0 0 0 2px #29d3ff,0 0 26px 3px #29d3ff,0 0 70px 10px #29d3ff66}75%{box-shadow:0 0 0 2px #a855ff,0 0 26px 3px #a855ff,0 0 70px 10px #a855ff66}}
.big{width:100%;font-size:17px;padding:15px 18px;animation:bglow 3s ease-in-out infinite}
@keyframes bglow{0%,100%{box-shadow:0 0 14px #ff2d3d}50%{box-shadow:0 0 28px 4px #ff2d3d}}
.dh{height:150px;display:flex;align-items:center;justify-content:center;font-size:76px}.db{padding:18px 20px 20px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--bd);font-size:12px;color:var(--mu);margin:0 6px 6px 0}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}input,textarea,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
#pl{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column}
#pl .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:#120d0d;color:#eee}#pl .bar b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#pl iframe{flex:1;border:0;width:100%;background:#000}
.st{color:#e0a020}footer{text-align:center;color:var(--mu);font-size:13px;padding:30px 16px}
.lg{height:50px;width:auto}.logo span{font:700 20px Georgia,serif;letter-spacing:.12em;text-shadow:0 0 8px #ff1f3d}header{border-bottom:1px solid var(--ac);box-shadow:0 1px 14px rgba(255,31,61,.35)}
.cv img,.dh img{width:100%;height:100%;object-fit:cover}.gal{display:flex;gap:8px;overflow-x:auto;margin:8px 0}.gal img{height:90px;border-radius:10px}
.bnr{display:flex;gap:12px;overflow-x:auto;margin-bottom:18px;padding:4px}.bnr img{height:120px;border-radius:14px;cursor:pointer;flex:none;animation:glow 6s linear infinite}
.fea{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:20px;margin-bottom:22px;animation:glow 8s linear infinite}.fi{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:21/8;cursor:pointer}.fi img{width:100%;height:100%;object-fit:cover}.fi span{position:absolute;left:12px;top:10px;background:#000a;color:#fff;border-radius:999px;padding:2px 12px;font-weight:700}
.upg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.uc{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden}.uc img,.uc video{width:100%;display:block}.ut{padding:10px 14px}.ut p{margin:4px 0 0;color:var(--mu)}

const $=i=>document.getElementById(i);
let db=null,mine=[],cat="Todos",qs="";
const idb=()=>new Promise(r=>{try{const o=indexedDB.open("playvault",1);o.onupgradeneeded=()=>o.result.createObjectStore("g",{keyPath:"id"});o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(e){r(null)}});
const all=()=>new Promise(r=>{if(!db)return r([]);try{const q=db.transaction("g").objectStore("g").getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}});
const put=g=>new Promise(r=>{if(!db)return r(false);try{const t=db.transaction("g","readwrite");t.objectStore("g").put(g);t.oncomplete=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}});
const del=id=>new Promise(r=>{if(!db)return r();try{const t=db.transaction("g","readwrite");t.objectStore("g").delete(id);t.oncomplete=()=>r()}catch(e){r()}});
const plays=id=>{try{return +localStorage.getItem("pv:"+id)||0}catch(e){return 0}};
const addPlay=id=>{try{localStorage.setItem("pv:"+id,plays(id)+1)}catch(e){}};
let CLOUD_G=[],CLOUD={f:[],b:[],u:[]};const list=()=>SEED.concat(CLOUD_G,mine);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bg=g=>`linear-gradient(135deg,${g.c1||"#3a1d5a"},${g.c2||"#120d1a"})`;
function render(){
 const cats=["Todos",...new Set(list().map(g=>g.cat))];
 $("cats").innerHTML=cats.map(c=>`<button class="${c==cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
 const f=list().filter(g=>(cat=="Todos"||g.cat==cat)&&(g.title+g.desc+(g.tags||[]).join(" ")).toLowerCase().includes(qs));
